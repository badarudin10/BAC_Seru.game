<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BACA SERU - Petualangan Belajar Membaca</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #E0F2FE; overflow-x: hidden; user-select: none; touch-action: manipulation;}
        .bounce { animation: bounce 1.5s infinite; }
        .pulse-fast { animation: pulse 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(-5%); } 50% { transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .confetti { position: absolute; width: 10px; height: 10px; background-color: #f00; animation: fall 3s linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- SISTEM AUDIO BAHASA INDONESIA ---
        const speak = (text) => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.rate = 0.9; 
                utterance.pitch = 1.2; // Suara agak tinggi agar lebih ramah anak
                window.speechSynthesis.speak(utterance);
            }
        };

        const playSoundEffect = (type) => {
            // Menggunakan sintesis suara sederhana untuk efek jika tidak ada file MP3
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gainNode = ctx.createGain();
            osc.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.start(); osc.stop(ctx.currentTime + 0.5);
            }
        };

        // --- KOMPONEN UI ---
        const Button = ({ onClick, children, color = "bg-blue-500", shadow = "shadow-blue-700", className = "" }) => (
            <button 
                onClick={() => { playSoundEffect('click'); onClick(); }}
                className={`${color} text-white font-bold py-4 px-8 rounded-full shadow-[0_6px_0_var(--tw-shadow-color)] ${shadow} active:shadow-[0_0px_0_var(--tw-shadow-color)] active:translate-y-[6px] transition-all text-xl ${className}`}
            >
                {children}
            </button>
        );

        // --- 1. LAYAR BERANDA ---
        const SplashScreen = ({ onStart }) => (
            <div className="min-h-screen flex flex-col items-center justify-center bg-gradient-to-b from-sky-300 to-blue-500 text-white p-6 text-center pop relative overflow-hidden">
                <div className="text-8xl mb-4 bounce">🦉</div>
                <h1 className="text-5xl md:text-6xl font-black mb-4 drop-shadow-lg tracking-wider text-yellow-300">BACA SERU</h1>
                <p className="text-xl md:text-2xl mb-8 font-bold drop-shadow-md">Ayo Baca, Main, dan Jadi Juara!</p>
                <div className="bg-white/20 p-6 rounded-3xl backdrop-blur-sm mb-12 max-w-md w-full">
                    <p className="text-xl">Halo! Namaku Bubu.<br/>Yuk kita bertualang dan belajar membaca!</p>
                </div>
                <Button onClick={() => { speak("Halo! Selamat datang di Baca Seru. Ayo mulai petualangan!"); onStart(); }} color="bg-yellow-400 text-yellow-900" shadow="shadow-yellow-600" className="w-full max-w-xs text-2xl pulse-fast">
                    MULAI MAIN
                </Button>
            </div>
        );

        // --- 2. PETA PETUALANGAN ---
        const MapScreen = ({ onSelectLevel, unlockedLevel, stars }) => {
            const worlds = [
                { id: 1, name: "Taman Huruf", desc: "Mengenal A, B, C", color: "bg-green-400", shadow: "shadow-green-600", icon: "🍎" },
                { id: 2, name: "Hutan Suku Kata", desc: "Belajar BA, BI, BU", color: "bg-teal-400", shadow: "shadow-teal-600", icon: "🌳" },
                { id: 3, name: "Negeri Mengeja", desc: "Menyusun Kata", color: "bg-purple-400", shadow: "shadow-purple-600", icon: "🏰" },
                { id: 4, name: "Lembah Kalimat", desc: "Membaca Kalimat", color: "bg-rose-400", shadow: "shadow-rose-600", icon: "🌈" }
            ];

            return (
                <div className="min-h-screen bg-sky-100 p-4 md:p-6 pop pb-20">
                    <div className="flex justify-between items-center mb-8 bg-white p-3 rounded-full shadow-md border-4 border-sky-200">
                        <div className="flex items-center gap-2">
                            <div className="w-10 h-10 bg-sky-200 rounded-full flex items-center justify-center text-xl">👦</div>
                            <span className="font-bold text-lg text-sky-800">Pemain</span>
                        </div>
                        <div className="flex items-center gap-2 bg-yellow-100 px-4 py-1 rounded-full border-2 border-yellow-400">
                            <span className="text-xl bounce">⭐</span>
                            <span className="font-black text-xl text-yellow-700">{stars}</span>
                        </div>
                    </div>

                    <h2 className="text-3xl font-black text-center text-sky-800 mb-8">Peta Dunia</h2>

                    <div className="flex flex-col gap-6 max-w-md mx-auto relative px-4">
                        <div className="absolute left-1/2 top-0 bottom-0 w-4 bg-sky-300 -translate-x-1/2 z-0 rounded-full opacity-50"></div>

                        {worlds.map((world, index) => {
                            const isUnlocked = world.id <= unlockedLevel;
                            return (
                                <div key={world.id} className={`relative z-10 flex ${index % 2 === 0 ? 'justify-start' : 'justify-end'}`}>
                                    <div 
                                        onClick={() => {
                                            if (isUnlocked) {
                                                speak(`Masuk ke ${world.name}`);
                                                onSelectLevel(world.id);
                                            } else {
                                                speak("Selesaikan level sebelumnya dulu ya.");
                                            }
                                        }}
                                        className={`w-4/5 p-4 rounded-3xl border-4 flex items-center gap-4 cursor-pointer
                                        ${isUnlocked ? `border-white shadow-[0_8px_0_var(--tw-shadow-color)] ${world.shadow}${world.color} transform hover:scale-105 active:translate-y-[8px] active:shadow-none` : 'border-gray-300 bg-gray-200 shadow-[0_8px_0_#9CA3AF]'} transition-all`}
                                    >
                                        <div className="text-4xl bg-white/30 p-2 rounded-2xl">{isUnlocked ? world.icon : '🔒'}</div>
                                        <div>
                                            <div className={`font-black text-xl drop-shadow-md ${isUnlocked ? 'text-white' : 'text-gray-500'}`}>
                                                {world.name}
                                            </div>
                                            <div className={`font-bold text-sm ${isUnlocked ? 'text-white/90' : 'text-gray-400'}`}>
                                                {isUnlocked ? world.desc : 'Terkunci'}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // --- 3. MESIN PERMAINAN (GAME ENGINE) ---
        const GameEngine = ({ levelId, onWin, onBack }) => {
            const [step, setStep] = useState(0);

            // Data Konten per Level
            const levelData = {
                1: [ // Taman Huruf
                    { type: 'learn_letter', letter: 'A', word: 'APEL', emoji: '🍎' },
                    { type: 'learn_letter', letter: 'B', word: 'BOLA', emoji: '⚽' },
                    { type: 'pick_letter', question: 'Mana huruf B?', target: 'B', options: ['A', 'B', 'C'] }
                ],
                2: [ // Suku Kata
                    { type: 'learn_syllable', s1: 'B', s2: 'A', result: 'BA', word: 'BAJU', emoji: '👕' },
                    { type: 'learn_syllable', s1: 'B', s2: 'I', result: 'BI', word: 'BIJI', emoji: '🌱' },
                    { type: 'pick_syllable', question: 'Mana suku kata BA?', target: 'BA', options: ['BI', 'BU', 'BA'] }
                ],
                3: [ // Mengeja
                    { type: 'spell', word: 'BOLA', emoji: '⚽', letters: ['O', 'L', 'B', 'A'] },
                    { type: 'spell', word: 'BUKU', emoji: '📖', letters: ['U', 'B', 'K', 'U'] }
                ],
                4: [ // Membaca Kalimat
                    { type: 'sentence', sentence: 'INI BOLA', emoji: '⚽', words: ['BOLA', 'INI'] },
                    { type: 'sentence', sentence: 'IBU MASAK', emoji: '🍳', words: ['MASAK', 'IBU'] }
                ]
            };

            const currentTasks = levelData[levelId];
            const currentTask = currentTasks[step];

            const handleNext = () => {
                playSoundEffect('win');
                if (step + 1 < currentTasks.length) {
                    setStep(step + 1);
                } else {
                    onWin(levelId); // Selesai semua task di level ini
                }
            };

            // Render Task Berdasarkan Tipe
            const renderTask = () => {
                if (currentTask.type === 'learn_letter') {
                    useEffect(() => { speak(`Ini huruf ${currentTask.letter}. ${currentTask.letter} untuk ${currentTask.word}.`); }, [currentTask]);
                    return (
                        <div className="flex flex-col items-center justify-center h-full pop">
                            <div className="text-8xl mb-8 bounce">{currentTask.emoji}</div>
                            <div className="flex items-end gap-4 mb-12">
                                <span className="text-9xl font-black text-white drop-shadow-xl">{currentTask.letter}</span>
                                <span className="text-6xl font-bold text-white/80 drop-shadow-md">{currentTask.letter.toLowerCase()}</span>
                            </div>
                            <h2 className="text-4xl font-black text-white mb-12 uppercase tracking-widest">{currentTask.word}</h2>
                            <Button onClick={handleNext} color="bg-yellow-400 text-yellow-900" shadow="shadow-yellow-600">LANJUT</Button>
                        </div>
                    );
                }

                if (currentTask.type === 'pick_letter' || currentTask.type === 'pick_syllable') {
                    useEffect(() => { speak(currentTask.question); }, [currentTask]);
                    return (
                        <div className="flex flex-col items-center justify-center h-full pop w-full">
                            <h2 className="text-4xl font-black text-white text-center mb-12 bg-black/20 p-6 rounded-3xl w-full">{currentTask.question}</h2>
                            <div className="flex justify-center gap-6 flex-wrap w-full">
                                {currentTask.options.map((opt, i) => (
                                    <button key={i} onClick={() => {
                                        if (opt === currentTask.target) { speak("Pintar!"); handleNext(); }
                                        else { speak("Tetot! Coba lagi."); }
                                    }} className="w-32 h-32 bg-white rounded-3xl shadow-[0_8px_0_#9CA3AF] active:translate-y-[8px] active:shadow-none text-6xl font-black text-sky-600 flex items-center justify-center transition-all">
                                        {opt}
                                    </button>
                                ))}
                            </div>
                        </div>
                    );
                }

                if (currentTask.type === 'learn_syllable') {
                    const [merged, setMerged] = useState(false);
                    useEffect(() => { speak(`Gabungkan ${currentTask.s1} dan ${currentTask.s2}`); }, [currentTask]);
                    return (
                        <div className="flex flex-col items-center justify-center h-full pop">
                            <div className="text-8xl mb-12">{currentTask.emoji}</div>
                            {!merged ? (
                                <div className="flex items-center gap-8 mb-12">
                                    <div className="w-32 h-40 bg-white rounded-3xl shadow-lg flex items-center justify-center text-7xl font-black text-blue-600">{currentTask.s1}</div>
                                    <div className="text-6xl font-black text-white">+</div>
                                    <div className="w-32 h-40 bg-white rounded-3xl shadow-lg flex items-center justify-center text-7xl font-black text-red-500">{currentTask.s2}</div>
                                </div>
                            ) : (
                                <div className="w-64 h-40 bg-yellow-300 rounded-3xl shadow-[0_10px_0_#A16207] flex items-center justify-center text-8xl font-black text-yellow-900 mb-12 pop pulse-fast">
                                    {currentTask.result}
                                </div>
                            )}
                            {!merged ? (
                                <Button onClick={() => { setMerged(true); speak(`${currentTask.result}. ${currentTask.word}!`); }} color="bg-yellow-400 text-yellow-900" shadow="shadow-yellow-600">GABUNGKAN</Button>
                            ) : (
                                <Button onClick={handleNext} color="bg-white text-teal-600" shadow="shadow-gray-300">LANJUT</Button>
                            )}
                        </div>
                    );
                }

                if (currentTask.type === 'spell') {
                    const [placed, setPlaced] = useState(Array(currentTask.word.length).fill(null));
                    const [avail, setAvail] = useState(currentTask.letters.map((char, id) => ({ id, char })));
                    
                    useEffect(() => { speak(`Ayo susun kata ${currentTask.word}`); }, [currentTask]);

                    const placeLetter = (letterObj) => {
                        const emptyIdx = placed.findIndex(l => l === null);
                        if (emptyIdx !== -1) {
                            speak(letterObj.char);
                            const newPlaced = [...placed];
                            newPlaced[emptyIdx] = letterObj;
                            setPlaced(newPlaced);
                            setAvail(avail.filter(l => l.id !== letterObj.id));

                            if (emptyIdx === currentTask.word.length - 1) {
                                const formed = newPlaced.map(l => l.char).join('');
                                if (formed === currentTask.word) {
                                    speak(`Hore! ${currentTask.word}`);
                                    setTimeout(handleNext, 1500);
                                } else {
                                    speak("Ups, belum tepat. Yuk ulang!");
                                    setTimeout(() => { setPlaced(Array(currentTask.word.length).fill(null)); setAvail(currentTask.letters.map((char, id) => ({ id, char }))); }, 1000);
                                }
                            }
                        }
                    };
                    return (
                        <div className="flex flex-col items-center justify-center h-full pop w-full">
                            <div className="text-8xl mb-8 bg-white/20 p-6 rounded-full">{currentTask.emoji}</div>
                            <div className="flex gap-3 mb-16">
                                {placed.map((l, i) => (
                                    <div key={i} className={`w-16 h-24 md:w-24 md:h-32 rounded-2xl border-4 ${l ? 'bg-white border-white shadow-xl text-purple-600' : 'border-dashed border-white/50 bg-purple-900/20'} flex items-center justify-center text-5xl font-black transition-all`}>
                                        {l ? l.char : ''}
                                    </div>
                                ))}
                            </div>
                            <div className="flex gap-4 flex-wrap justify-center w-full max-w-sm">
                                {avail.map(l => (
                                    <button key={l.id} onClick={() => placeLetter(l)} className="w-16 h-20 md:w-20 md:h-24 bg-yellow-400 rounded-2xl shadow-[0_6px_0_#A16207] active:translate-y-[6px] active:shadow-none flex items-center justify-center text-4xl font-black text-yellow-900 transition-all">
                                        {l.char}
                                    </button>
                                ))}
                            </div>
                        </div>
                    );
                }

                if (currentTask.type === 'sentence') {
                    const [placed, setPlaced] = useState([]);
                    const [avail, setAvail] = useState(currentTask.words.map((word, id) => ({ id, word })));
                    const targetLength = currentTask.sentence.split(' ').length;

                    useEffect(() => { speak(`Susun kalimat: ${currentTask.sentence}`); }, [currentTask]);

                    const placeWord = (wordObj) => {
                        speak(wordObj.word);
                        const newPlaced = [...placed, wordObj];
                        setPlaced(newPlaced);
                        setAvail(avail.filter(w => w.id !== wordObj.id));

                        if (newPlaced.length === targetLength) {
                            const formed = newPlaced.map(w => w.word).join(' ');
                            if (formed === currentTask.sentence) {
                                speak(`Pintar! ${currentTask.sentence}`);
                                setTimeout(handleNext, 1500);
                            } else {
                                speak("Coba susun lagi ya.");
                                setTimeout(() => { setPlaced([]); setAvail(currentTask.words.map((word, id) => ({ id, word }))); }, 1000);
                            }
                        }
                    };

                    return (
                        <div className="flex flex-col items-center justify-center h-full pop w-full">
                            <div className="text-8xl mb-8 bounce">{currentTask.emoji}</div>
                            <div className="flex flex-wrap justify-center gap-4 mb-16 min-h-[80px] w-full p-4 bg-black/20 rounded-3xl">
                                {placed.length === 0 && <span className="text-white/50 text-xl font-bold mt-4">Susun kata di sini...</span>}
                                {placed.map((w, i) => (
                                    <div key={i} className="px-6 py-4 bg-white rounded-2xl shadow-md text-3xl font-black text-rose-600">
                                        {w.word}
                                    </div>
                                ))}
                            </div>
                            <div className="flex gap-4 flex-wrap justify-center">
                                {avail.map(w => (
                                    <button key={w.id} onClick={() => placeWord(w)} className="px-6 py-4 bg-yellow-400 rounded-2xl shadow-[0_6px_0_#A16207] active:translate-y-[6px] active:shadow-none text-2xl md:text-3xl font-black text-yellow-900">
                                        {w.word}
                                    </button>
                                ))}
                            </div>
                        </div>
                    );
                }
            };

            const bgColors = { 1: 'bg-green-500', 2: 'bg-teal-500', 3: 'bg-purple-500', 4: 'bg-rose-500' };

            return (
                <div className={`min-h-screen ${bgColors[levelId]} p-6 flex flex-col relative`}>
                    <div className="absolute top-6 left-6 z-10">
                        <button onClick={onBack} className="w-12 h-12 bg-white/30 rounded-full flex items-center justify-center text-white font-bold text-2xl backdrop-blur-sm">X</button>
                    </div>
                    {/* Progress Bar */}
                    <div className="w-full max-w-xs mx-auto bg-black/20 h-4 rounded-full mb-8 overflow-hidden">
                        <div className="bg-yellow-400 h-full transition-all duration-500" style={{width: `${(step / currentTasks.length) * 100}%`}}></div>
                    </div>
                    <div className="flex-1 flex items-center justify-center">
                        {renderTask()}
                    </div>
                </div>
            );
        };

        // --- 4. LAYAR KEMENANGAN LEVEL ---
        const WinScreen = ({ onContinue, starsEarned }) => {
            useEffect(() => { 
                playSoundEffect('win'); 
                speak(`Luar biasa! Kamu mendapatkan ${starsEarned} bintang. Kamu naik kelas!`); 
            }, []);

            return (
                <div className="min-h-screen bg-yellow-400 flex flex-col items-center justify-center p-6 text-yellow-900 pop relative overflow-hidden">
                    <div className="text-8xl mb-8 bounce">🏆</div>
                    <h1 className="text-5xl font-black mb-4 text-center">LUAR BIASA!</h1>
                    <p className="text-2xl font-bold mb-8 text-center">Level Selesai!</p>
                    
                    <div className="flex gap-4 mb-12">
                        {[...Array(starsEarned)].map((_, i) => (
                            <span key={i} className="text-7xl drop-shadow-lg pop" style={{animationDelay: `${i * 0.2}s`}}>⭐</span>
                        ))}
                    </div>
                    
                    <Button onClick={onContinue} color="bg-white text-yellow-600" shadow="shadow-yellow-200" className="text-2xl">
                        LANJUTKAN
                    </Button>
                </div>
            );
        };

        // --- KONTROLER UTAMA (App) ---
        const App = () => {
            // Load state dari LocalStorage
            const [screen, setScreen] = useState('splash');
            const [stars, setStars] = useState(() => parseInt(localStorage.getItem('bacaSeru_stars')) || 0);
            const [unlockedLevel, setUnlockedLevel] = useState(() => parseInt(localStorage.getItem('bacaSeru_level')) || 1);
            const [currentPlayingLevel, setCurrentPlayingLevel] = useState(null);

            // Simpan otomatis jika berubah
            useEffect(() => {
                localStorage.setItem('bacaSeru_stars', stars);
                localStorage.setItem('bacaSeru_level', unlockedLevel);
            }, [stars, unlockedLevel]);

            const handleLevelWin = (levelId) => {
                setStars(prev => prev + 3); // Dapat 3 bintang
                if (levelId === unlockedLevel && unlockedLevel < 4) {
                    setUnlockedLevel(prev => prev + 1); // Buka level berikutnya
                }
                setScreen('win');
            };

            const renderScreen = () => {
                switch(screen) {
                    case 'splash':
                        return <SplashScreen onStart={() => setScreen('map')} />;
                    case 'map':
                        return <MapScreen 
                            unlockedLevel={unlockedLevel} 
                            stars={stars} 
                            onSelectLevel={(id) => { setCurrentPlayingLevel(id); setScreen('game'); }} 
                        />;
                    case 'game':
                        return <GameEngine 
                            levelId={currentPlayingLevel} 
                            onWin={handleLevelWin} 
                            onBack={() => setScreen('map')} 
                        />;
                    case 'win':
                        return <WinScreen 
                            starsEarned={3} 
                            onContinue={() => setScreen('map')} 
                        />;
                    default:
                        return <SplashScreen onStart={() => setScreen('map')} />;
                }
            };

            return (
                <div className="w-full max-w-md mx-auto bg-white min-h-screen shadow-2xl relative overflow-hidden select-none">
                    {renderScreen()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
